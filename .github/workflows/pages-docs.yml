name: Docs

# Optional: publishes the screenshot gallery in docs/ to GitHub Pages.
#
# It is manual on purpose — a new repository has Pages switched off, and a deploy job that fails
# because of a setting would paint the repo red for no reason. To use it:
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   2. Actions → Docs → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
