name: Docs

# Serves the screenshot gallery from docs/ on GitHub Pages, so the README images can also be
# browsed as a page. Optional — delete this file if you do not want Pages enabled.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages-docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
