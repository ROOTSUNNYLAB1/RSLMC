name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and security harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and integration tests
        shell: bash
        run: |
          set +e
          bun test --timeout 120000 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          echo "bun test exited with $status"
          if [ "$status" -ne 0 ]; then
            grep -E "^\(fail\)|^error:|Unhandled error" /tmp/test.log | head -40
            # Name the file that broke, so the failure is readable from the run page
            # (and from the check-run annotations) instead of only inside the log.
            for f in $(ls tests/*.test.ts | sort); do
              bun test --timeout 120000 "$f" > /tmp/one.log 2>&1 || echo "::error title=Failing test file::$f"
            done
          fi
          exit "$status"

      - name: Security harness (adversarial, real HTTP/WebSocket)
        env:
          PENTEST_PORT: "3941"
        run: bun run tests/security/pentest.ts

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: tests/security/last-run.json
          if-no-files-found: ignore

  windows:
    name: Smoke test on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
        shell: bash
      - name: Platform-specific logic (data folder, JVM presets, versions)
        run: bun test --timeout 120000 tests/data-location.test.ts tests/jvm-presets.test.ts tests/mc-version.test.ts
        shell: bash
