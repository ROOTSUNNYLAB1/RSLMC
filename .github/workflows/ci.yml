name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, tests and security harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Installer syntax and lint
        shell: bash
        run: |
          bash -n install.sh
          echo "install.sh parses"
          # shellcheck is advisory here: it is not installed on every runner, but when it is, it fails
          # the job on genuine errors (-S error) so a broken installer cannot be tagged.
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -S error install.sh
            echo "shellcheck: no errors"
          else
            echo "shellcheck not installed on this runner — skipped (bash -n already passed)"
          fi

      - name: Unit and integration tests
        shell: bash
        run: |
          set +e
          bun run test 2>&1 | tee /tmp/test.log
          status=${PIPESTATUS[0]}
          # scripts/test-all.ts runs each file in its own process and prints a per-file summary, so a
          # failure is already attributed. Surface the file name on the run page as well.
          for f in $(grep -E "^✗ tests/" /tmp/test.log | awk '{print $2}'); do
            echo "::error title=Failing test file::$f"
          done
          exit "$status"

      - name: Security harness (adversarial, real HTTP/WebSocket)
        env:
          PENTEST_PORT: "3941"
        run: bun run tests/security/pentest.ts

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: tests/security/last-run.json
          if-no-files-found: ignore

  windows:
    name: Smoke test on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
        shell: bash
      - name: Platform-specific logic (data folder, JVM presets, versions)
        run: bun run test tests/data-location.test.ts tests/jvm-presets.test.ts tests/mc-version.test.ts
        shell: bash
