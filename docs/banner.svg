<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 304" width="1280" height="304" role="img" aria-label="RSLMC — Minecraft server management panel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="0.55" stop-color="#0e0e10"/>
      <stop offset="1" stop-color="#0b0f0c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="14%" cy="6%" r="62%">
      <stop offset="0" stop-color="#3ecf72" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#3ecf72" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="304" fill="url(#bg)"/>
  <rect width="1280" height="304" fill="url(#grid)"/>
  <rect width="1280" height="304" fill="url(#glow)"/>
  <rect x="0" y="303" width="1280" height="1" fill="#1e1e23"/>

  <!-- mark: stacked server rack tiles -->
  <g transform="translate(96 62)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#101613" stroke="#1f6f45"/>
    <rect x="12" y="14" width="32" height="7" rx="2" fill="#3ecf72"/>
    <rect x="12" y="25" width="22" height="7" rx="2" fill="#2a7a4c"/>
    <rect x="12" y="36" width="27" height="7" rx="2" fill="#1f6f45"/>
    <circle cx="44" cy="17.5" r="2.5" fill="#8ef0b3"/>
  </g>

  <text x="176" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="42" font-weight="700" letter-spacing="4" fill="#f2f3f5">RSLMC</text>
  <text x="178" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12.5" letter-spacing="4.5" fill="#6a6c75">MINECRAFT SERVER PANEL</text>

  <!--
    Feature pills. Every rect is sized from its own label (11.5 px monospace = 0.6 em advance,
    plus 17 px of padding on both sides), so no label can ever spill out of its border again.
    Rows are right-aligned to a single 1184 px edge.
  -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <!-- row 1 -->
    <rect x="875" y="58" width="145" height="28" rx="7" fill="#111114" stroke="#26262c"/>
    <text x="892" y="76" fill="#9b9da5">Bun + TypeScript</text>
    <rect x="1032" y="58" width="152" height="28" rx="7" fill="#111114" stroke="#26262c"/>
    <text x="1049" y="76" fill="#9b9da5">React 19 · SQLite</text>
    <!-- row 2 -->
    <rect x="902" y="96" width="97" height="28" rx="7" fill="#111114" stroke="#26262c"/>
    <text x="919" y="114" fill="#9b9da5">12 themes</text>
    <rect x="1011" y="96" width="173" height="28" rx="7" fill="#111114" stroke="#26262c"/>
    <text x="1028" y="114" fill="#9b9da5">Discord · Google SSO</text>
    <!-- row 3 -->
    <rect x="868" y="134" width="166" height="28" rx="7" fill="#0f1512" stroke="#1f6f45"/>
    <text x="885" y="152" fill="#5fdc93">114 security checks</text>
    <rect x="1046" y="134" width="138" height="28" rx="7" fill="#111114" stroke="#26262c"/>
    <text x="1063" y="152" fill="#9b9da5">Windows + Linux</text>
  </g>

  <rect x="96" y="182" width="1088" height="1" fill="#1e1e23"/>

  <text x="96" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
        font-size="23" font-weight="600" fill="#e8e9ec">Real processes, real metrics, no black boxes.</text>
  <text x="96" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
        font-size="14.5" fill="#9b9da5">Create, run and manage Minecraft servers — eleven server flavours, Java 8–25, live console,</text>
  <text x="96" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
        font-size="14.5" fill="#9b9da5">backups, plugins, worlds, schedules and role-based access.</text>
</svg>
